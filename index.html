<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ТеплоСервис — выбор версии сайта</title>
  <link rel="icon" type="image/png" href="https://xn--63-dlclatsyhnjed.xn--p1ai/static/assets/img/logo-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f5f6;
      color: #1a222b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 48px 24px;
      -webkit-font-smoothing: antialiased;
    }
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 56px;
    }
    header img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    h1 span { color: #c6221d; }
    header p {
      margin-top: 10px;
      font-size: 1rem;
      color: #54626d;
    }
    .versions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 860px;
    }
    @media (max-width: 720px) {
      .versions { grid-template-columns: 1fr; max-width: 360px; }
      header { margin-bottom: 40px; }
    }
    a.card {
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #e9eef2;
      border-radius: 14px;
      padding: 32px 28px;
      text-decoration: none;
      color: inherit;
      transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
    }
    a.card:hover {
      border-color: #c6221d;
      box-shadow: 0 10px 30px rgba(26, 34, 43, .08);
      transform: translateY(-2px);
    }
    .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #faf1f0;
      color: #c6221d;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 20px;
    }
    a.card h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    a.card p {
      font-size: .92rem;
      line-height: 1.55;
      color: #54626d;
      margin-bottom: 24px;
    }
    .go {
      margin-top: auto;
      font-size: .9rem;
      font-weight: 600;
      color: #c6221d;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    a.card:hover .go { gap: 10px; }
    .go { transition: gap .2s ease; }
    footer {
      margin-top: 56px;
      font-size: .8rem;
      color: #8494a0;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://xn--63-dlclatsyhnjed.xn--p1ai/static/assets/img/logo-192.png" alt="ТеплоСервис">
    <h1>Тепло<span>Сервис</span></h1>
    <p>Выберите версию сайта для просмотра</p>
  </header>

  <nav class="versions">
    <a class="card" href="v1/">
      <span class="num">1</span>
      <h2>Версия 1</h2>
      <p>Первый вариант дизайна лендинга</p>
      <span class="go">Смотреть →</span>
    </a>
    <a class="card" href="v2/">
      <span class="num">2</span>
      <h2>Версия 2</h2>
      <p>Второй вариант дизайна лендинга</p>
      <span class="go">Смотреть →</span>
    </a>
    <a class="card" href="v3/">
      <span class="num">3</span>
      <h2>Версия 3</h2>
      <p>Третий вариант дизайна лендинга</p>
      <span class="go">Смотреть →</span>
    </a>
  </nav>

  <footer>© ТеплоСервис · Самара · teploservis63.рф</footer>
</body>
</html>
