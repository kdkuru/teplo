<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teplo — скоро</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #10131a;
      color: #f2f4f8;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 560px; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #ff8a3d; margin: 0 auto 28px;
      box-shadow: 0 0 24px 4px rgba(255, 138, 61, .45);
    }
    h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 700; letter-spacing: -.02em; }
    p { margin-top: 16px; color: #9aa3b2; font-size: 1.05rem; line-height: 1.6; }
    .hint { margin-top: 40px; font-size: .8rem; color: #5b6472; letter-spacing: .08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="dot"></div>
    <h1>Teplo</h1>
    <p>Сайт готовится. Здесь скоро появится лендинг.</p>
    <div class="hint">Coming soon</div>
  </main>
</body>
</html>
